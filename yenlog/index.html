<style>
:root{
  --bg:#DFE4E7;--doc:#FFF;--panel:#F4F6F7;--ink:#0C161C;--ink-2:#465D69;--ink-3:#879BA6;
  --rule:#DCE3E6;--rule-2:#B0BEC4;--pos:#0B5A4A;--neg:#87262F;--neu:#2B4E61;--stamp:#9E7016;
  --disp:'Archivo',system-ui,sans-serif;--body:'Source Sans 3',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.42;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--disp);font-size:9.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.neu{color:var(--neu)}.mut{color:var(--ink-3)}

.wrap{display:flex;min-height:100vh}
.side{width:228px;flex:none;background:var(--ink);color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.mark{padding:18px 18px 15px;border-bottom:1px solid rgba(255,255,255,.13)}
.mark b{display:block;font-family:var(--disp);font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.mark i{display:block;font-style:normal;font-family:var(--disp);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.48);margin-top:5px}
.snap{padding:13px 18px;border-bottom:1px solid rgba(255,255,255,.13)}
.snap .lbl{color:rgba(255,255,255,.42)}
.snap .v{font-family:var(--mono);font-size:19px;font-weight:500;letter-spacing:-.02em;margin-top:2px}
.snap .d{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px}
.snap .d span{color:#fff}
.nav{flex:1;padding:8px 0 14px}
.grp{padding:12px 18px 4px;font-family:var(--disp);font-size:8.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.32)}
.nav button{display:block;width:100%;text-align:left;padding:6px 18px;font-size:13.5px;color:rgba(255,255,255,.66);border-left:2px solid transparent}
.nav button:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav button.on{color:#fff;font-weight:600;border-left-color:#fff;background:rgba(255,255,255,.09)}
.sfoot{padding:12px 18px 16px;border-top:1px solid rgba(255,255,255,.13)}
.sfoot .btn{width:100%;background:#fff;color:var(--ink);border-color:#fff}

.main{flex:1;min-width:0;padding:20px 26px 90px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--rule-2)}
.head h1{font-family:var(--disp);font-size:21px;font-weight:700;letter-spacing:-.02em}
.head p{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tools select,.tools input{background:var(--doc);border:1px solid var(--rule-2);padding:6px 8px;font-size:12.5px}

.btn{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.03em;padding:7px 13px;border:1px solid var(--ink);background:var(--ink);color:#fff}
.btn:hover{background:#000}
.btn.ghost{background:transparent;color:var(--ink)}.btn.ghost:hover{background:rgba(255,255,255,.75)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.dgr{border-color:var(--neg);color:var(--neg);background:transparent}
.btn:focus-visible,.nav button:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule-2);border:1px solid var(--rule-2);margin-bottom:18px}
.kpi{background:var(--doc);padding:12px 14px 13px}
.kpi .v{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:-.03em;margin-top:4px;line-height:1.15}
.kpi .d{font-size:11.5px;color:var(--ink-3);margin-top:2px}

.doc{background:var(--doc);border:1px solid var(--rule-2);margin-bottom:18px}
.docHead{padding:12px 16px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.docHead h2{font-family:var(--disp);font-size:13.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.docHead .m{font-size:12px;color:var(--ink-2);margin-top:2px}

table{width:100%;border-collapse:collapse}
th{font-family:var(--disp);font-size:9px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 9px;border-bottom:1px solid var(--rule-2);white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--rule);vertical-align:top;font-size:13.5px}
tr:last-child td{border-bottom:none}
tbody tr.k:hover{background:var(--panel);cursor:pointer}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.dt{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.kod{font-family:var(--mono);font-size:12px;color:var(--neu);white-space:nowrap}
.no{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.sm2{font-size:11px;color:var(--ink-3);display:block;margin-top:1px}
tfoot td{border-top:2px solid var(--ink);border-bottom:none;padding:10px 9px;font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
tfoot td.n{font-family:var(--mono);font-size:15px;letter-spacing:-.02em;text-transform:none}
tr.sub td{background:var(--panel);font-size:12.5px;color:var(--ink-2)}
tr.tot td{border-top:1px solid var(--ink);font-weight:700}

.pill{display:inline-block;font-family:var(--disp);font-size:8.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;padding:1px 5px;border:1px solid currentColor}
.pill.f{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.w{color:var(--stamp)}
.badge{background:var(--stamp);color:#fff;padding:1px 5px;font-family:var(--disp);font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}

.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select{background:var(--doc);border:1px solid var(--rule-2);padding:6px 8px;font-size:12.5px;min-width:0}
.filters input:focus,.filters select:focus{outline:2px solid var(--ink);outline-offset:-1px}
.filters .search{flex:1;min-width:150px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--doc);border:1px solid var(--rule-2);padding:14px 16px;margin-bottom:18px}
.card h3{font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:11px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule)}
.mrow:last-child{border-bottom:none}
.mrow .nm{min-width:0;flex:1}
.bar{height:5px;background:var(--rule);margin-top:4px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0}
.empty{padding:30px 18px;text-align:center;color:var(--ink-3);font-size:13.5px}
.empty b{display:block;color:var(--ink-2);font-weight:600;margin-bottom:4px;font-size:14.5px}

.veil{position:fixed;inset:0;background:rgba(12,22,28,.5);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:24px 12px;overflow-y:auto}
.sheet{background:var(--doc);width:100%;max-width:720px;border:1px solid var(--ink);padding:18px 20px 24px;margin:auto}
.sheet.narrow{max-width:520px}
.sheet h2{font-family:var(--disp);font-size:17px;font-weight:700;margin-bottom:3px}
.sheet .hint{font-size:12px;color:var(--ink-2);margin-bottom:15px}
.tpls{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:16px}
.tpls button{padding:8px 10px;border:1px solid var(--rule-2);text-align:left;background:transparent}
.tpls button b{display:block;font-family:var(--disp);font-size:11.5px;font-weight:600}
.tpls button span{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.tpls button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tpls button.on span{color:rgba(255,255,255,.6)}
.f{margin-bottom:11px}
.f label{display:block;margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;background:var(--doc);border:1px solid var(--rule-2);padding:7px 9px;font-size:14px}
.f input:focus,.f select:focus{outline:2px solid var(--ink);outline-offset:-1px}
.f.amt input{font-family:var(--mono);font-size:22px;font-weight:500}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:16px}
.acts .btn{flex:1;padding:10px}
.del{color:var(--neg);font-size:12.5px;text-decoration:underline;margin-top:12px;display:inline-block;cursor:pointer}

.prev{background:var(--panel);border:1px solid var(--rule-2);padding:11px 13px;margin-bottom:14px}
.prev .lbl{margin-bottom:7px;display:block}
.prev table td{border-color:var(--rule-2);padding:4px 6px;font-size:12.5px;background:transparent}
.prev table th{padding:3px 6px;font-size:8.5px}
.dgb{display:flex;justify-content:space-between;font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding-top:8px;margin-top:6px;border-top:1px solid var(--rule-2)}
.dgb.ok{color:var(--pos)}.dgb.no{color:var(--neg)}

.lines td{padding:4px 5px}
.lines input,.lines select{width:100%;border:1px solid var(--rule);background:var(--doc);padding:5px 6px;font-size:13px}
.lines input.n{text-align:right;font-family:var(--mono)}
.lines .x{color:var(--ink-3);font-size:16px;padding:0 4px}
.lines .x:hover{color:var(--neg)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--rule-2);padding:3px 6px 3px 9px;font-size:13px}
.chip button{color:var(--ink-3);font-size:15px;line-height:1;padding:0 2px}.chip button:hover{color:var(--neg)}
.addline{display:flex;gap:6px;flex-wrap:wrap}
.addline input,.addline select{background:var(--doc);border:1px solid var(--rule-2);padding:6px 8px;font-size:13.5px}
.addline input{flex:1;min-width:110px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:9px 16px;font-size:13px;z-index:99;max-width:90vw}
.fab{display:none}.printHead{display:none}.sign{display:none}

@media(max-width:900px){
  .wrap{display:block}.side{display:none}.main{padding:14px 12px 92px}
  .kpis{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}.tpls{grid-template-columns:1fr}
  th.hs,td.hs{display:none}.head h1{font-size:19px}
  .sheet{padding:14px 13px 20px}
  .fab{display:flex;position:fixed;bottom:60px;right:13px;z-index:40;width:50px;height:50px;border-radius:50%;background:var(--ink);color:#fff;align-items:center;justify-content:center;font-size:25px;box-shadow:0 4px 16px rgba(12,22,28,.34)}
  .tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--ink);z-index:41}
  .tabbar button{flex:1;padding:9px 1px 11px;font-family:var(--disp);font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .tabbar button.on{color:#fff;box-shadow:inset 0 2px 0 #fff}
}
@media(min-width:901px){.tabbar{display:none}}
@media print{
  body{background:#fff;font-size:11px}
  .side,.tabbar,.fab,.tools,.filters,.veil,#toast,.noprint{display:none!important}
  .main{padding:0}.head{border:none;margin:0}.head h1,.head p{display:none}
  .doc{border:none;margin-bottom:8px}
  .printHead{display:block;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
  .printHead .t{font-family:var(--disp);font-size:17px;font-weight:700}
  .printHead .s{font-size:10.5px;color:#333;margin-top:2px}
  .sign{display:flex!important;gap:50px;margin-top:50px}
  .sign div{flex:1;border-top:1px solid #000;padding-top:5px;font-size:10.5px}
  td,th{padding:4px 6px}tbody tr.k:hover{background:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 ['100','KASA','A'],['102','BANKALAR','A'],['108','DİĞER HAZIR DEĞERLER','A'],
 ['120','ALICILAR','A'],['121','ALACAK SENETLERİ','A'],['126','VERİLEN DEPOZİTO VE TEMİNATLAR','A'],

 ['391','HESAPLANAN KDV','P'],['500','SERMAYE','P'],['590','DÖNEM NET KÂRI','P'],
 ['600','YURTİÇİ SATIŞLAR','G'],['602','DİĞER GELİRLER','G'],['649','DİĞER OLAĞAN GELİR VE KÂRLAR','G'],

const tipOf=k=>PLANMAP[ana(k)]?.tip||'M';
const borcBakiyeli=k=>['A','M'].includes(tipOf(k));

const FISTUR={tahsil:{ad:'Tahsil fişi',ek:'THS'},tediye:{ad:'Tediye fişi',ek:'TDY'},mahsup:{ad:'Mahsup fişi',ek:'MHS'},acilis:{ad:'Açılış fişi',ek:'ACL'}};

/* ============ İŞLEM ŞABLONLARI ============ */
const TPL={
 satis   :{ad:'Satış / hakediş faturası',ac:'Yenlog’a kestiğin fatura',fis:'mahsup',kdv:1,alan:['cari','gelirHesap','vade','mm']},
 alis    :{ad:'Alış / gider faturası',   ac:'Sana kesilen fatura, ödeme sonra',fis:'mahsup',kdv:1,alan:['satici','giderHesap','vade','mm']},

};

const GRUPLAR=[
 ['Genel',[['panel','Panel']]],
 ['İşlemler',[['fisler','Fiş listesi']]],
 ['Defterler',[['yevmiye','Yevmiye defteri'],['kebir','Defter-i kebir'],['kasabanka','Kasa & banka']]],
 ['Cari hesaplar',[['ekstre','Cari ekstre'],['yaslandirma','Yaşlandırma']]],
 ['Mali tablolar',[['mizan','Mizan'],['kdv','KDV özeti'],['gelirtablo','Gelir tablosu'],['bilanco','Bilanço']]],
 ['Yönetim',[['tanimlar','Tanımlar'],['ayarlar','Ayarlar & yedek']]]
];
const MOBIL=[['panel','Panel'],['fisler','Fişler'],['ekstre','Ekstre'],['mizan','Mizan'],['tanimlar','Tanım']];

let S=null,view='panel',donem='',cariSec='',kebirSec='',draft=null,F={q:'',tur:'',hesap:'',mm:'',bas:'',bit:''};

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TL=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=n=>TL.format(Math.abs(n||0));
const sgn=n=>(n<0?'−':'')+fmt(n)+' ₺';
const psgn=n=>(n>0?'+':n<0?'−':'')+fmt(n)+' ₺';
const dmy=d=>{const p=String(d||'').split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:(d||'—')};
const num=v=>{v=String(v??'').replace(/\s/g,'').replace(/\./g,'').replace(',','.');const n=parseFloat(v);return isNaN(n)?0:n};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const ayOf=d=>String(d).slice(0,7);
const ayAd=m=>m?new Date(m+'-01').toLocaleDateString('tr-TR',{month:'long',year:'numeric'}):'Tüm dönem';
const gunFark=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);

function seed(){return{
 firma:{ad:'Yenlog',kisi:'Cihad',unvan:'Nakliye ve lojistik hizmetleri',vkn:'',yil:new Date().getFullYear()},
 kasalar:[
  {id:uid(),kod:'102.01',ad:'Vivien Yenen · Enpara',tur:'banka',iban:'',ana:true},

  {id:uid(),kod:'100.01',ad:'Nakit kasa',tur:'nakit',iban:''}
 ],
 cariler:[{id:uid(),kod:'120.01',ad:'Yenlog',tip:'alici',vkn:'',vade:30,ana:true}],
 gelirHesaplari:[
  {id:uid(),kod:'600.01',ad:'Nakliye hizmet geliri'},
  {id:uid(),kod:'600.02',ad:'Ek hizmet / sefer farkı'},
  {id:uid(),kod:'649.01',ad:'Diğer olağan gelirler'}
 ],
 giderHesaplari:[
  {id:uid(),kod:'740.01',ad:'Akaryakıt'},{id:uid(),kod:'740.02',ad:'Araç bakım ve onarım'},

/* ============ DEPOLAMA: YEREL + GITHUB SENKRON ============ */
const SENK_KEY='yenlog_senkron_ayar';
let DEPO={mod:'yerel',token:'',owner:'',repo:'',yol:'defter.json',dal:'main',sha:'',durum:'Yerel',son:''};
function depoOku(){try{Object.assign(DEPO,JSON.parse(localStorage.getItem(SENK_KEY)||'{}'))}catch(e){}}
function depoYaz(){try{localStorage.setItem(SENK_KEY,JSON.stringify(DEPO))}catch(e){}}
const ghHazir=()=>DEPO.mod==='github'&&DEPO.token&&DEPO.owner&&DEPO.repo;
function b64enc(s){const b=new TextEncoder().encode(s);let o='';
 for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)}
function b64dec(b){const s=atob(String(b).replace(/\s/g,''));const u=new Uint8Array(s.length);
 for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u)}
const ghUrl=()=>`https://api.github.com/repos/${DEPO.owner}/${DEPO.repo}/contents/${DEPO.yol}`;
const ghBas=()=>({Authorization:'Bearer '+DEPO.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
async function ghCek(){
 const r=await fetch(ghUrl()+'?ref='+encodeURIComponent(DEPO.dal)+'&t='+Date.now(),{headers:ghBas(),cache:'no-store'});
 if(r.status===404){DEPO.sha='';return null}
 if(r.status===401||r.status===403)throw new Error('Yetki reddedildi — token’ı kontrol et');
 if(!r.ok)throw new Error('GitHub '+r.status);
 const j=await r.json(); DEPO.sha=j.sha; depoYaz();
 return JSON.parse(b64dec(j.content));
}
async function ghGonder(mesaj){
 const g={message:mesaj||('Defter · '+new Date().toLocaleString('tr-TR')),
  content:b64enc(JSON.stringify(S,null,1)),branch:DEPO.dal};
 if(DEPO.sha)g.sha=DEPO.sha;
 const r=await fetch(ghUrl(),{method:'PUT',headers:{...ghBas(),'Content-Type':'application/json'},body:JSON.stringify(g)});
 if(r.status===409||r.status===422)throw new Error('Uzak defter değişmiş — önce “GitHub’dan çek” yap');
 if(r.status===401||r.status===403)throw new Error('Yetki reddedildi — token’ı kontrol et');
 if(!r.ok)throw new Error('GitHub '+r.status);
 const j=await r.json(); DEPO.sha=j.content.sha; DEPO.son=new Date().toISOString(); depoYaz();
}
function durumCiz(){
 const e=document.getElementById('senk'); if(!e)return;
 const s=DEPO.durum, hata=/hata|reddedildi|değişmiş/i.test(s);
 e.innerHTML=`<span class="lbl" style="color:rgba(255,255,255,.42)">Depolama</span>
  <div class="d" style="margin-top:2px"><span style="color:${hata?'#E28B8B':'#fff'}">${esc(s)}</span>${
  DEPO.son?' · '+new Date(DEPO.son).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):''}</div>`;
}
function yeniOlan(a,b){
 if(!a)return b; if(!b)return a;
 return (a.guncelleme||'')>=(b.guncelleme||'')?a:b;
}
async function load(){
 depoOku();
 let yerel=null,uzak=null;
 try{yerel=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 if(ghHazir()){
  try{uzak=await ghCek(); DEPO.durum='GitHub bağlı'; DEPO.son=new Date().toISOString()}
  catch(e){DEPO.durum=e.message}
 }else DEPO.durum=DEPO.mod==='github'?'GitHub ayarlanmadı':'Yerel (bu cihaz)';
 depoYaz();
 S=yeniOlan(yerel,uzak);
 if(!S)S=seed();
 const s=seed();
 for(const k in s) if(S[k]===undefined) S[k]=s[k];
 if(!S.kasalar.length)S.kasalar=s.kasalar;
 if(!S.cariler.length)S.cariler=s.cariler;
 if(!S.kasalar.some(k=>k.ana))S.kasalar[0].ana=true;
 S.kasalar.sort((a,b)=>(b.ana?1:0)-(a.ana?1:0));
 cariSec=(S.cariler.find(c=>c.ana)||S.cariler[0]).id;
 kebirSec=anaKasa().kod;
 render();
}
let itmeZaman=null;
function save(){
 S.guncelleme=new Date().toISOString();
 try{localStorage.setItem(KEY,JSON.stringify(S))}
 catch(e){toast('Bu cihaza kaydedilemedi — tarayıcı depolaması dolu olabilir')}
 if(ghHazir()){clearTimeout(itmeZaman);itmeZaman=setTimeout(()=>itele(),2500);
  DEPO.durum='Bekliyor…';durumCiz()}
}
async function itele(mesaj){
 if(!ghHazir())return;
 DEPO.durum='Gönderiliyor…';durumCiz();
 try{await ghGonder(mesaj);DEPO.durum='GitHub bağlı'}
 catch(e){DEPO.durum=e.message;toast(e.message)}
 depoYaz();durumCiz();
}
window.addEventListener('online',()=>{if(ghHazir()&&/hata|Bekliyor/i.test(DEPO.durum))itele()});
function toast(m){const t=document.getElementById('toast');t.innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(()=>t.innerHTML='',3000)}
function iz(islem,detay){S.log.unshift({t:new Date().toISOString(),islem,detay});S.log=S.log.slice(0,300)}

const anaCari=()=>S.cariler.find(c=>c.ana)||S.cariler[0];

/* ============ HESAP ÇÖZÜMLEME ============ */
function tumHesaplar(){
 const a=[];
 S.kasalar.forEach(k=>a.push({kod:k.kod,ad:k.ad,grup:'Kasa & banka'}));
 S.cariler.forEach(c=>a.push({kod:c.kod,ad:c.ad,grup:'Cari hesaplar'}));
 S.gelirHesaplari.forEach(g=>a.push({kod:g.kod,ad:g.ad,grup:'Gelir hesapları'}));
 S.giderHesaplari.forEach(g=>a.push({kod:g.kod,ad:g.ad,grup:'Gider hesapları'}));
 PLAN.forEach(p=>a.push({kod:p[0],ad:p[1],grup:'Ana hesaplar'}));
 const gor=new Set();
 return a.filter(x=>gor.has(x.kod)?false:(gor.add(x.kod),true)).sort((x,y)=>x.kod.localeCompare(y.kod));
}
let HCACHE=null;
function hAd(kod){
 if(!HCACHE)HCACHE=Object.fromEntries(tumHesaplar().map(h=>[h.kod,h.ad]));
 return HCACHE[kod]||PLANMAP[ana(kod)]?.ad||kod;
}
const yenile=()=>{HCACHE=null};

/* ============ HAREKETLER ============ */
function satirlar(filtre){
 const out=[];
 for(const f of S.fisler){
  if(donem&&ayOf(f.tarih)!==donem)continue;
  f.satirlar.forEach((s,i)=>{const r={...s,fis:f,ix:i};if(!filtre||filtre(r))out.push(r)});
 }
 return out.sort((a,b)=>a.fis.tarih.localeCompare(b.fis.tarih)||a.fis.no.localeCompare(b.fis.no));
}
function tumSatirlar(filtre){
 const out=[];
 for(const f of S.fisler) f.satirlar.forEach((s,i)=>{const r={...s,fis:f,ix:i};if(!filtre||filtre(r))out.push(r)});
 return out.sort((a,b)=>a.fis.tarih.localeCompare(b.fis.tarih)||a.fis.no.localeCompare(b.fis.no));
}
function bakiye(kod,ustSinir){
 let b=0;
 for(const f of S.fisler){ if(ustSinir&&f.tarih>=ustSinir)continue;
  for(const s of f.satirlar){ if(s.kod!==kod)continue; b+=(s.borc||0)-(s.alacak||0) } }
 return borcBakiyeli(kod)?b:-b;
}
function bakiyeHam(kod,pre){ /* borç − alacak, işaretsiz mantık */
 let b=0;
 for(const f of S.fisler){ if(pre&&f.tarih>=pre)continue;
  for(const s of f.satirlar){ if(pre==='ANA'?ana(s.kod)!==kod:s.kod!==kod)continue; b+=(s.borc||0)-(s.alacak||0) } }
 return b;
}
const kasaBak=k=>bakiye(k,'');
const kasaToplam=()=>S.kasalar.reduce((a,k)=>a+bakiye(k.kod),0);
const cariBak=c=>{const x=by(S.cariler,c);return x?bakiye(x.kod):0};
const by=(a,id)=>a.find(x=>x.id===id);
const byKod=(a,kod)=>a.find(x=>x.kod===kod);

function mizanVeri(detay){
 const m={};
 for(const f of S.fisler){ if(donem&&ayOf(f.tarih)!==donem)continue;
  for(const s of f.satirlar){ const k=detay?s.kod:ana(s.kod);
   if(!m[k])m[k]={kod:k,borc:0,alacak:0}; m[k].borc+=s.borc||0; m[k].alacak+=s.alacak||0 } }
 return Object.values(m).sort((a,b)=>a.kod.localeCompare(b.kod));
}
function anaToplam(pre,tip){ /* 3 haneli kod grubunun net bakiyesi */
 let b=0;
 for(const f of S.fisler){ if(donem&&tip==='donem'&&ayOf(f.tarih)!==donem)continue;
  for(const s of f.satirlar){ if(ana(s.kod)!==pre)continue; b+=(s.borc||0)-(s.alacak||0) } }
 return borcBakiyeli(pre)?b:-b;
}
function kdvOzet(){
 const h=anaToplam('391','donem'), i=anaToplam('191','donem');
 return {hesaplanan:h,indirilecek:i,fark:h-i};
}
function gelirTablosu(){
 const g=['600','602','649'].map(k=>({kod:k,ad:PLANMAP[k].ad,v:anaToplam(k,'donem')}));
 const m=['740','760','770','780','689'].map(k=>({kod:k,ad:PLANMAP[k].ad,v:anaToplam(k,'donem')}));
 const tg=g.reduce((a,x)=>a+x.v,0), tm=m.reduce((a,x)=>a+x.v,0);
 return {gelir:g,gider:m,toplamGelir:tg,toplamGider:tm,kar:tg-tm};
}
function yaslandirma(cid){
 const c=by(S.cariler,cid); if(!c)return{acik:[],toplam:0,kova:{}};
 const hs=tumSatirlar(s=>s.kod===c.kod);
 const borclar=hs.filter(s=>(s.borc||0)>0).map(s=>({tarih:s.fis.tarih,no:s.fis.no,vade:s.vade||s.fis.vade||s.fis.tarih,tutar:s.borc,ac:s.aciklama||s.fis.aciklama,kalan:s.borc}));
 let odenen=hs.reduce((a,s)=>a+(s.alacak||0),0);
 for(const b of borclar){ if(odenen<=0)break; const d=Math.min(odenen,b.kalan); b.kalan=r2(b.kalan-d); odenen=r2(odenen-d) }
 const acik=borclar.filter(b=>b.kalan>0.004);
 const kova={'Vadesi gelmemiş':0,'1–30 gün':0,'31–60 gün':0,'61–90 gün':0,'90+ gün':0};
 const bg=today();
 acik.forEach(b=>{const g=gunFark(b.vade,bg);
  kova[g<=0?'Vadesi gelmemiş':g<=30?'1–30 gün':g<=60?'31–60 gün':g<=90?'61–90 gün':'90+ gün']+=b.kalan});
 return {acik,toplam:acik.reduce((a,b)=>a+b.kalan,0),kova};
}
function donemler(){return [...new Set(S.fisler.map(f=>ayOf(f.tarih)))].sort().reverse()}
function fisNo(tur){S.sayac[tur]=(S.sayac[tur]||0)+1;return FISTUR[tur].ek+'-'+S.firma.yil+'-'+String(S.sayac[tur]).padStart(5,'0')}
const kilitli=t=>S.ayarlar.kilit&&t<=S.ayarlar.kilit;

/* ---- FİŞ LİSTESİ ---- */
function vFisler(){
 const q=F.q.toLowerCase().trim();
 const list=S.fisler.filter(f=>{
  if(donem&&ayOf(f.tarih)!==donem)return false;
  if(F.tur&&f.tur!==F.tur)return false;
  if(F.hesap&&!f.satirlar.some(s=>s.kod===F.hesap))return false;
  if(F.mm&&!f.satirlar.some(s=>s.mm===F.mm))return false;
  if(F.bas&&f.tarih<F.bas)return false;
  if(F.bit&&f.tarih>F.bit)return false;
  if(q&&![f.no,f.aciklama,f.belge,...f.satirlar.map(s=>s.kod+' '+hAd(s.kod)+' '+(s.aciklama||''))].join(' ').toLowerCase().includes(q))return false;
  return true;
 }).sort((a,b)=>b.tarih.localeCompare(a.tarih)||b.no.localeCompare(a.no));
 const t=list.reduce((a,f)=>a+f.satirlar.reduce((x,s)=>x+(s.borc||0),0),0);
 return `<div class="head"><div><h1>Fiş listesi</h1><p>${list.length} fiş · toplam hacim ${fmt(t)} ₺</p></div>
  <div class="tools"><button class="btn ghost sm" onclick="csvYevmiye()">CSV</button><button class="btn ghost sm" onclick="fisAc()">Boş mahsup fişi</button><button class="btn" onclick="sihirbaz()">+ Yeni işlem</button></div></div>

/* ---- YEVMİYE DEFTERİ ---- */
function vYevmiye(){
 const list=S.fisler.filter(f=>!donem||ayOf(f.tarih)===donem).sort((a,b)=>a.tarih.localeCompare(b.tarih)||a.no.localeCompare(b.no));
 let tb=0,ta=0;
 const govde=list.map(f=>{
  const ft=f.satirlar.reduce((a,s)=>a+(s.borc||0),0);tb+=ft;ta+=f.satirlar.reduce((a,s)=>a+(s.alacak||0),0);
  return `<tr class="sub k" onclick="fisAc('${f.id}')"><td class="dt">${dmy(f.tarih)}</td><td class="no">${esc(f.no)}</td>
   <td colspan="2"><b>${esc(f.aciklama||FISTUR[f.tur].ad)}</b> <span class="pill">${FISTUR[f.tur].ad}</span>${f.belge?' <span class="mut">Belge '+esc(f.belge)+'</span>':''}</td>
   <td class="n">${fmt(ft)}</td><td class="n">${fmt(ft)}</td></tr>`
  +f.satirlar.map(s=>`<tr><td></td><td></td><td class="kod">${esc(s.kod)}</td>
   <td>${esc(hAd(s.kod))}${s.aciklama?'<span class="sm2">'+esc(s.aciklama)+'</span>':''}${s.mm?'<span class="sm2">MM: '+esc(nmOf(S.merkezler,s.mm))+'</span>':''}</td>
   <td class="n">${s.borc?fmt(s.borc):''}</td><td class="n">${s.alacak?fmt(s.alacak):''}</td></tr>`).join('');
 }).join('');
 return pHead('Yevmiye Defteri',ayAd(donem)+' · '+list.length+' fiş')+
 `<div class="head"><div><h1>Yevmiye defteri</h1><p>${ayAd(donem)} · ${list.length} fiş · kronolojik</p></div>
  <div class="tools">${donemSel()}<button class="btn ghost sm" onclick="window.print()">Yazdır</button><button class="btn ghost sm" onclick="csvYevmiye()">CSV</button></div></div>
 <div class="doc"><table><thead><tr><th style="width:78px">Tarih</th><th style="width:118px">Fiş no</th>
  <th style="width:82px">Hesap</th><th>Açıklama</th><th class="n" style="width:112px">Borç</th><th class="n" style="width:112px">Alacak</th></tr></thead>
  <tbody>${govde||`<tr><td colspan="6"><div class="empty"><b>Kayıt yok</b>Bu dönemde yevmiye kaydı bulunmuyor.</div></td></tr>`}</tbody>
  <tfoot><tr><td colspan="4">Yevmiye toplamı</td><td class="n">${fmt(tb)}</td><td class="n">${fmt(ta)}</td></tr></tfoot></table></div>`+imza();
}
const nmOf=(a,id)=>{const x=by(a,id);return x?x.ad:''};

/* ---- DEFTER-İ KEBİR ---- */
function vKebir(){
 const kod=kebirSec||anaKasa().kod;
 const bas=donem?donem+'-01':'';
 const devir=donem?bakiye(kod,bas):0;
 const hs=satirlar(s=>s.kod===kod);
 let yur=devir,tb=0,ta=0;
 const bb=borcBakiyeli(kod);
 const govde=hs.map(s=>{const b=s.borc||0,a=s.alacak||0;tb+=b;ta+=a;yur+=bb?(b-a):(a-b);
  return `<tr class="k" onclick="fisAc('${s.fis.id}')"><td class="dt">${dmy(s.fis.tarih)}</td><td class="no">${esc(s.fis.no)}</td>
   <td><b>${esc(s.aciklama||s.fis.aciklama||FISTUR[s.fis.tur].ad)}</b>${s.mm?'<span class="sm2">MM: '+esc(nmOf(S.merkezler,s.mm))+'</span>':''}</td>
   <td class="n">${b?fmt(b):''}</td><td class="n">${a?fmt(a):''}</td><td class="n" style="font-weight:600">${sgn(yur)}</td></tr>`}).join('');
 return pHead('Defter-i Kebir · '+kod+' '+hAd(kod),ayAd(donem))+
 `<div class="head"><div><h1>Defter-i kebir</h1><p>${esc(kod)} — ${esc(hAd(kod))} · ${bb?'borç':'alacak'} bakiyeli hesap</p></div>
  <div class="tools"><select onchange="setKebir(this.value)">${hesapOpts(kod)}</select>${donemSel()}<button class="btn ghost sm" onclick="window.print()">Yazdır</button></div></div>
 <div class="doc"><div class="docHead"><div><h2>${esc(kod)} · ${esc(hAd(kod))}</h2><div class="m">Bakiye sütunu hesabın doğal yönüne göre yürütülür.</div></div>
   <div class="n" style="font-size:19px;font-weight:600">${sgn(bakiye(kod))}</div></div>
  <table><thead><tr><th style="width:78px">Tarih</th><th style="width:118px">Fiş no</th><th>Açıklama</th>
   <th class="n" style="width:106px">Borç</th><th class="n" style="width:106px">Alacak</th><th class="n" style="width:118px">Bakiye</th></tr></thead>
  <tbody>${donem?`<tr class="sub"><td class="dt">${dmy(bas)}</td><td class="no">—</td><td><i>Devreden bakiye</i></td><td></td><td></td><td class="n" style="font-weight:600">${sgn(devir)}</td></tr>`:''}

  <tfoot><tr><td colspan="3">Dönem toplamı</td><td class="n">${fmt(tb)}</td><td class="n">${fmt(ta)}</td><td class="n">${sgn(yur)}</td></tr></tfoot></table></div>`+imza();
}

/* ---- MİZAN ---- */
let mizanDetay=true;
function vMizan(){
 const m=mizanVeri(mizanDetay);
 let tb=0,ta=0,bb=0,ab=0;
 const govde=m.map(x=>{tb+=x.borc;ta+=x.alacak;const f=x.borc-x.alacak;
  if(f>0)bb+=f;else ab+=-f;
  return `<tr class="k" onclick="kebirGit('${x.kod}')"><td class="kod">${esc(x.kod)}</td><td>${esc(hAd(x.kod))}</td>
   <td class="n">${fmt(x.borc)}</td><td class="n">${fmt(x.alacak)}</td>
   <td class="n">${f>0?fmt(f):''}</td><td class="n">${f<0?fmt(-f):''}</td></tr>`}).join('');
 const denk=Math.abs(tb-ta)<.01&&Math.abs(bb-ab)<.01;
 return pHead('Mizan',ayAd(donem)+' · '+(mizanDetay?'alt hesap kırılımlı':'ana hesap bazlı'))+
 `<div class="head"><div><h1>Mizan</h1><p>${ayAd(donem)} · ${m.length} hesap · ${denk?'denklik sağlandı':'DENKLİK BOZUK'}</p></div>
  <div class="tools"><select onchange="mizanDetay=this.value==='1';render()"><option value="1" ${mizanDetay?'selected':''}>Alt hesap kırılımı</option><option value="0" ${mizanDetay?'':'selected'}>Ana hesap özeti</option></select>
   ${donemSel()}<button class="btn ghost sm" onclick="window.print()">Yazdır</button><button class="btn ghost sm" onclick="csvMizan()">CSV</button></div></div>
 <div class="doc"><table><thead><tr><th style="width:82px">Kod</th><th>Hesap adı</th>
   <th class="n" style="width:112px">Borç toplamı</th><th class="n" style="width:112px">Alacak toplamı</th>
   <th class="n" style="width:112px">Borç bakiye</th><th class="n" style="width:112px">Alacak bakiye</th></tr></thead>
  <tbody>${govde||`<tr><td colspan="6"><div class="empty"><b>Kayıt yok</b></div></td></tr>`}</tbody>
  <tfoot><tr><td colspan="2">Genel toplam</td><td class="n">${fmt(tb)}</td><td class="n">${fmt(ta)}</td><td class="n">${fmt(bb)}</td><td class="n">${fmt(ab)}</td></tr></tfoot></table>
  <div style="padding:11px 16px;border-top:1px solid var(--rule-2);background:var(--panel)" class="${denk?'pos':'neg'}">
   <b style="font-family:var(--disp);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase">${denk?'✓ Mizan denk — borç ve alacak toplamları eşit':'✗ Denklik bozuk — fark '+fmt(tb-ta)+' ₺'}</b></div></div>`+imza();
}
const kebirGit=k=>{kebirSec=k;view='kebir';render()};

function wSatirlar(){
 const t=TPL[W.tpl], matrah=r2(num(W.matrah)), oran=t.kdv&&W.kdvVar?num(W.kdvOran):0;

  case 'masraf': p(gd?.kod,matrah,0,gd?.ad,mm); p('191',kdv,0,'İndirilecek KDV %'+oran); p(kasa?.kod,0,toplam,'Masraf ödemesi'); break;
  case 'virman': p(kasa2?.kod,toplam,0,'Virman giriş'); p(kasa?.kod,0,toplam,'Virman çıkış'); break;
  case 'digerGel': p(kasa?.kod,toplam,0,'Diğer gelir'); p(gh?.kod,0,matrah,gh?.ad,mm); p('391',0,kdv,'Hesaplanan KDV %'+oran); break;

  vade:draft.vade||'',durum:'onayli',satirlar:sat.map(s=>({kod:s.kod,borc:r2(+s.borc||0),alacak:r2(+s.alacak||0),aciklama:s.aciklama||'',mm:s.mm||''}))};
 const i=S.fisler.findIndex(x=>x.id===f.id);
 if(i>-1){S.fisler[i]=f;iz('Fiş güncellendi',f.no)} else {S.fisler.push(f);iz('Fiş oluşturuldu',f.no+' · elle')}
 save();kapat();render();toast((i>-1?'Fiş güncellendi · ':'Fiş kaydedildi · ')+f.no);
}
function fisSil(id){
 const f=S.fisler.find(x=>x.id===id);
 S.fisler=S.fisler.filter(x=>x.id!==id); iz('Fiş silindi',f?.no||id);
 save();kapat();render();toast('Fiş silindi');
}
function kapat(){document.getElementById('modal').innerHTML='';draft=null;W=null}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(draft||W))kapat()});

/* ============ TANIMLAR ============ */

  ${S.kasalar.map(k=>`<div class="mrow"><div class="nm">${k.ana?'<span class="badge">Ana kasa</span> ':''}<span class="mono mut">${esc(k.kod)}</span> <b>${esc(k.ad)}</b>

   <div style="display:flex;gap:6px;flex:none">${k.ana?'':`<button class="btn ghost sm" onclick="anaYap('${k.id}')">Ana yap</button>`}

 <div class="card"><h3>Cari hesaplar · 120 alıcı / 320 satıcı</h3>
  ${S.cariler.map(c=>`<div class="mrow"><div class="nm">${c.ana?'<span class="badge">Ana cari</span> ':''}<span class="mono mut">${esc(c.kod)}</span> <b>${esc(c.ad)}</b>
   <span class="sm2">${c.tip==='alici'?'Alıcı':'Satıcı'} · Vade ${c.vade||30} gün · Bakiye ${psgn(bakiye(c.kod))}${c.vkn?' · VKN '+esc(c.vkn):''}</span></div>
   <button class="btn ghost sm" onclick="tanimSil('cariler','${c.id}')">Sil</button></div>`).join('')}
  <div class="addline" style="margin-top:11px">

 <div class="g2">

   <div class="addline"><input id="ghKod" placeholder="600.03" style="max-width:100px"><input id="ghAd" placeholder="Hesap adı"><button class="btn sm" onclick="ekleHesap('gelirHesaplari','gh')">Ekle</button></div></div>
  <div class="card"><h3>Gider hesapları · 740 / 760 / 770 / 780</h3>${chips(S.giderHesaplari,'giderHesaplari')}

 </div>
 <div class="card"><h3>Masraf merkezleri</h3>${chips(S.merkezler,'merkezler')}
  <div class="addline"><input id="mmAd" placeholder="Yeni masraf merkezi (hat, araç, proje)"><button class="btn sm" onclick="ekleMM()">Ekle</button></div></div>

  <table><thead><tr><th style="width:70px">Kod</th><th>Hesap adı</th><th class="hs" style="width:90px">Tip</th><th class="n" style="width:130px">Bakiye</th></tr></thead>

    <td class="hs mut">${{A:'Aktif',P:'Pasif',G:'Gelir',M:'Gider'}[p[2]]}</td><td class="n">${b?sgn(b):'—'}</td></tr>`:''}).join('')}</tbody></table></div>`;

function anaYap(id){S.kasalar.forEach(k=>k.ana=k.id===id);S.kasalar.sort((a,b)=>(b.ana?1:0)-(a.ana?1:0));save();render();toast('Ana kasa güncellendi')}
function ekleKasa(){
 const kod=document.getElementById('kKod').value.trim(), ad=document.getElementById('kAd').value.trim();
 if(!kod||!ad){toast('Kod ve ad gir');return}
 if(!/^(100|102|108)\./.test(kod)){toast('Kasa hesabı 100. veya 102. ile başlamalı');return}
 if(byKod(S.kasalar,kod)){toast('Bu kod zaten var');return}
 S.kasalar.push({id:uid(),kod,ad,tur:document.getElementById('kTur').value,iban:document.getElementById('kIban').value.trim()});
 save();render();
}
function ekleCari(){
 const kod=document.getElementById('cKod').value.trim(), ad=document.getElementById('cAd').value.trim();
 const tip=document.getElementById('cTip').value;
 if(!kod||!ad){toast('Kod ve ünvan gir');return}
 if(tip==='alici'&&!/^120\./.test(kod)){toast('Alıcı hesabı 120. ile başlamalı');return}
 if(tip==='satici'&&!/^320\./.test(kod)){toast('Satıcı hesabı 320. ile başlamalı');return}
 if(byKod(S.cariler,kod)){toast('Bu kod zaten var');return}
 S.cariler.push({id:uid(),kod,ad,tip,vkn:document.getElementById('cVkn').value.trim(),vade:num(document.getElementById('cVade').value)||30});
 save();render();
}
function ekleHesap(kol,pre){
 const kod=document.getElementById(pre+'Kod').value.trim(), ad=document.getElementById(pre+'Ad').value.trim();
 if(!kod||!ad){toast('Kod ve ad gir');return}
 if(!PLANMAP[ana(kod)]){toast('Kodun ana hesabı hesap planında yok');return}
 S[kol].push({id:uid(),kod,ad});save();render();
}
function ekleMM(){const ad=document.getElementById('mmAd').value.trim();if(!ad)return;S.merkezler.push({id:uid(),ad});save();render()}
function tanimSil(kol,id){
 const x=by(S[kol],id); if(!x)return;
 if(x.kod&&S.fisler.some(f=>f.satirlar.some(s=>s.kod===x.kod))){toast('Bu hesapta kayıt var, önce fişleri sil');return}
 if(kol==='merkezler'&&S.fisler.some(f=>f.satirlar.some(s=>s.mm===id))){toast('Bu masraf merkezinde kayıt var');return}
 if((kol==='kasalar'||kol==='cariler')&&S[kol].length<2){toast('En az bir kayıt kalmalı');return}
 S[kol]=S[kol].filter(y=>y.id!==id);
 if(kol==='kasalar'&&!S.kasalar.some(k=>k.ana))S.kasalar[0].ana=true;
 if(kol==='cariler'&&cariSec===id)cariSec=S.cariler[0].id;
 save();render();
}

/* ============ AYARLAR ============ */

 return `<div class="head"><div><h1>Ayarlar & yedek</h1><p>Künye, dönem kilidi, denetim izi ve veri aktarımı</p></div></div>

 <div class="card"><h3>Depolama & senkron</h3>

   <div class="f"><label class="lbl">Dosya yolu</label><input id="sYol" value="${esc(DEPO.yol)}" placeholder="defter.json"></div></div>
  <div class="f"><label class="lbl">Erişim anahtarı (fine-grained token)</label>
   <input id="sToken" type="password" value="${esc(DEPO.token)}" placeholder="github_pat_..."></div>
  <div style="padding:9px 11px;background:var(--panel);border-left:3px solid var(--stamp);font-size:12.5px;margin-bottom:12px">
   Anahtar yalnızca bu cihazın tarayıcısında saklanır, hiçbir yere gönderilmez. Ortak kullanılan bir bilgisayarda GitHub senkronunu açma.
   Repo <b>private</b> olmalı — muhasebe verin herkese açık olmasın.</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="btn sm" onclick="senkKaydet()">Ayarları kaydet</button>

   <button class="btn ghost sm" onclick="senkCek()">GitHub’dan çek</button></div>`
  :`<p style="font-size:13px;color:var(--ink-2)">Defter şu an yalnızca bu tarayıcıda duruyor. Telefon ve bilgisayarını aynı veriyle kullanmak için GitHub senkronunu seç.</p>`}
 </div>
 <div class="card"><h3>Veri aktarımı</h3>
  <p style="font-size:13px;color:var(--ink-2);margin-bottom:11px">Defter bu tarayıcıda saklanıyor. Her ay sonu yedek al; muhasebecine CSV gönderebilirsin.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="btn ghost sm" onclick="disaAktar()">JSON yedeği indir</button>

   <label class="btn ghost sm" style="display:inline-block">Yedek yükle<input type="file" accept="application/json" style="display:none" onchange="iceAktar(this)"></label>
   <button class="btn dgr sm" onclick="sifirla()">Defteri sıfırla</button></div></div>
 <div class="card"><h3>Denetim izi · son 40 hareket</h3>
  <table><thead><tr><th style="width:150px">Zaman</th><th style="width:150px">İşlem</th><th>Detay</th></tr></thead>
  <tbody>${S.log.slice(0,40).map(l=>`<tr><td class="dt">${new Date(l.t).toLocaleString('tr-TR')}</td><td>${esc(l.islem)}</td><td class="mut">${esc(l.detay)}</td></tr>`).join('')

function ayarKaydet(){
 S.firma.ad=document.getElementById('aFirma').value.trim()||'Yenlog';
 S.firma.kisi=document.getElementById('aKisi').value.trim()||'Cihad';
 S.firma.unvan=document.getElementById('aUnvan').value.trim();
 S.firma.vkn=document.getElementById('aVkn').value.trim();
 S.firma.yil=document.getElementById('aYil').value.trim()||new Date().getFullYear();
 S.ayarlar.kdv=num(document.getElementById('aKdv').value)||20;
 iz('Künye güncellendi','');save();render();toast('Kaydedildi');
}
function senkModDegis(v){DEPO.mod=v;depoYaz();render()}
function senkKaydet(){
 DEPO.owner=document.getElementById('sOwner').value.trim();
 DEPO.repo=document.getElementById('sRepo').value.trim();
 DEPO.yol=document.getElementById('sYol').value.trim()||'defter.json';
 DEPO.token=document.getElementById('sToken').value.trim();
 DEPO.sha='';depoYaz();render();toast('Senkron ayarları kaydedildi');
}
async function senkSina(){
 senkKaydet();
 if(!ghHazir()){toast('Kullanıcı adı, repo ve anahtar gerekli');return}
 DEPO.durum='Sınanıyor…';durumCiz();
 try{const u=await ghCek();
  DEPO.durum='GitHub bağlı';DEPO.son=new Date().toISOString();depoYaz();render();
  toast(u?'Bağlantı tamam — uzakta defter bulundu':'Bağlantı tamam — repo boş, ilk gönderimde dosya oluşur');
 }catch(e){DEPO.durum=e.message;depoYaz();render();toast(e.message)}
}
async function senkCek(){
 if(!ghHazir()){toast('Önce ayarları kaydet');return}
 try{const u=await ghCek();
  if(!u){toast('Uzakta defter yok');return}
  if(!confirm('GitHub’daki defter bu cihazdakinin yerine geçecek. Devam edilsin mi?'))return;
  S=u;const s=seed();for(const k in s)if(S[k]===undefined)S[k]=s[k];
  cariSec=(S.cariler.find(c=>c.ana)||S.cariler[0]).id;kebirSec=anaKasa().kod;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  DEPO.durum='GitHub bağlı';DEPO.son=new Date().toISOString();depoYaz();
  iz('GitHub’dan çekildi','');render();toast('Defter GitHub’dan yüklendi');
 }catch(e){toast(e.message)}
}
function kilitKaydet(){S.ayarlar.kilit=document.getElementById('aKilit').value;iz('Dönem kilidi',S.ayarlar.kilit||'kaldırıldı');save();render();toast('Kilit güncellendi')}
function sifirla(){
 if(!confirm('Tüm fişler ve tanımlar silinecek. Devam edilsin mi?'))return;
 S=seed();cariSec=S.cariler[0].id;kebirSec=S.kasalar[0].kod;save();render();toast('Defter sıfırlandı');
}
function indir(icerik,ad,tip){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+icerik],{type:tip}));a.download=ad;a.click()}
const csv=rows=>rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n');
function csvYevmiye(){
 const rows=[['Tarih','FisNo','FisTuru','BelgeNo','FisAciklama','HesapKodu','HesapAdi','SatirAciklama','MasrafMerkezi','Borc','Alacak']];
 [...S.fisler].sort((a,b)=>a.tarih.localeCompare(b.tarih)).forEach(f=>f.satirlar.forEach(s=>
  rows.push([f.tarih,f.no,FISTUR[f.tur].ad,f.belge,f.aciklama,s.kod,hAd(s.kod),s.aciklama,nmOf(S.merkezler,s.mm),(s.borc||0).toFixed(2),(s.alacak||0).toFixed(2)])));
 indir(csv(rows),'yevmiye-'+today()+'.csv','text/csv;charset=utf-8');
}
function csvMizan(){
 const rows=[['Kod','HesapAdi','BorcToplam','AlacakToplam','BorcBakiye','AlacakBakiye']];
 mizanVeri(true).forEach(x=>{const f=x.borc-x.alacak;
  rows.push([x.kod,hAd(x.kod),x.borc.toFixed(2),x.alacak.toFixed(2),f>0?f.toFixed(2):'',f<0?(-f).toFixed(2):''])});
 indir(csv(rows),'mizan-'+(donem||'tum')+'.csv','text/csv;charset=utf-8');
}
function csvEkstre(){
 const c=by(S.cariler,cariSec);if(!c)return;
 const rows=[['Tarih','FisNo','Aciklama','Vade','Borc','Alacak','Bakiye']];
 let b=donem?bakiye(c.kod,donem+'-01'):0;
 satirlar(s=>s.kod===c.kod).forEach(s=>{b+=(s.borc||0)-(s.alacak||0);
  rows.push([s.fis.tarih,s.fis.no,s.aciklama||s.fis.aciklama,s.vade||s.fis.vade||'',(s.borc||0).toFixed(2),(s.alacak||0).toFixed(2),b.toFixed(2)])});
 indir(csv(rows),'ekstre-'+c.kod+'-'+(donem||'tum')+'.csv','text/csv;charset=utf-8');
}
function disaAktar(){indir(JSON.stringify(S,null,2),'yenlog-muhasebe-'+today()+'.json','application/json')}
function iceAktar(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.fisler||!d.kasalar)throw 0;
  S=d;const s=seed();for(const k in s)if(S[k]===undefined)S[k]=s[k];
  cariSec=(S.cariler.find(c=>c.ana)||S.cariler[0]).id;kebirSec=anaKasa().kod;
  iz('Yedek yüklendi',f.name);save();render();toast('Yedek yüklendi')}catch(e){toast('Dosya okunamadı — geçerli bir yedek seç')}};
 r.readAsText(f)}

if('serviceWorker' in navigator)
 window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
load();
